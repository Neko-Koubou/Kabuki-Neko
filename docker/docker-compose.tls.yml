# Optional HTTPS override for self-hosting (TASK-182; SA §10.2; docs/self-hosting.md).
#
#   KN_DOMAIN=quiz.example.org docker compose -f docker/docker-compose.yml \
#     -f docker/docker-compose.tls.yml up -d --build
#
# Adds a Caddy reverse proxy (docker/Caddyfile) with automatic TLS for one domain and routes
# /api, /socket.io and /uploads to the API, the public media bucket (scale profile) to MinIO and
# everything else to the web app. With this override:
# - only Caddy publishes ports (80, 443 and 443/udp for HTTP/3); the API, web and MinIO ports are
#   removed, so nothing reaches them except through the proxy;
# - every browser URL is https://KN_DOMAIN (one origin), so the web image is rebuilt with those
#   URLs (`--build`) and the refresh cookie stays same-site;
# - the API trusts X-Forwarded-For only from Caddy's fixed address on the private `edge` network
#   (KN_PROXY_SUBNET / KN_PROXY_ADDRESS), never from the web container or anything else.
# The scale profile works the same way: add `--profile scale` and DEPLOYMENT_PROFILE=scale.
# No credentials here; certificates live in the caddy-data volume.

x-public-urls: &public-urls
  NEXT_PUBLIC_APP_URL: https://${KN_DOMAIN:?set KN_DOMAIN to your public domain}
  APP_URL: https://${KN_DOMAIN}
  CORS_ORIGIN: https://${KN_DOMAIN}
  NEXT_PUBLIC_API_URL: https://${KN_DOMAIN}
  NEXT_PUBLIC_WS_URL: https://${KN_DOMAIN}
  S3_PUBLIC_URL: https://${KN_DOMAIN}/kabuki-neko-media
  TRUST_PROXY_CIDRS: '["${KN_PROXY_ADDRESS:-172.31.250.10}/32"]'

services:
  caddy:
    # Pinned by digest; the same index digest on Docker Hub and its mirrors.
    image: ${KN_CADDY_IMAGE:-caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee}
    restart: unless-stopped
    environment:
      KN_DOMAIN: ${KN_DOMAIN}
    ports:
      - "${KN_TLS_BIND_ADDRESS:-0.0.0.0}:${KN_HTTP_PORT:-80}:80"
      - "${KN_TLS_BIND_ADDRESS:-0.0.0.0}:${KN_HTTPS_PORT:-443}:443"
      - "${KN_TLS_BIND_ADDRESS:-0.0.0.0}:${KN_HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${KN_PROXY_ADDRESS:-172.31.250.10}
    depends_on:
      web:
        condition: service_healthy
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    read_only: true
    tmpfs: ["/tmp"]
    stop_grace_period: 15s

  api:
    environment: *public-urls
    ports: !reset []
    networks:
      default: {}
      edge: {}

  web:
    build:
      args:
        NEXT_PUBLIC_APP_URL: https://${KN_DOMAIN}
        NEXT_PUBLIC_API_URL: https://${KN_DOMAIN}
        NEXT_PUBLIC_WS_URL: https://${KN_DOMAIN}
        NEXT_PUBLIC_MEDIA_ORIGINS: https://${KN_DOMAIN}/kabuki-neko-media
    ports: !reset []
    networks:
      default: {}
      edge: {}

  minio:
    ports: !reset []
    networks:
      default: {}
      edge: {}

networks:
  edge:
    ipam:
      config:
        - subnet: ${KN_PROXY_SUBNET:-172.31.250.0/24}

volumes:
  caddy-data:
  caddy-config:

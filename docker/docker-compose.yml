# Kabuki Neko self-hosting (TASK-176; SA §10.2; US-16, US-17). Full guide: docs/deployment.md.
#
# Default profile: one web and one API container, with SQLite, in-memory game state and local
# uploads.
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Scale profile: the same web/API, plus PostgreSQL 16, Redis 7 (AOF) and MinIO (S3) with a
# bucket that is public for reading objects only. The API's DEPLOYMENT_PROFILE=scale selects the
# postgres/redis/s3 drivers; `--profile scale` starts the services they need. Both are required
# together, and `pnpm deploy:scale` (scripts/start-profile.ts) issues exactly that:
#   DEPLOYMENT_PROFILE=scale docker compose -f docker/docker-compose.yml --profile scale up -d --build
# DEPLOYMENT_PROFILE=scale without `--profile scale` does not fall back silently: the API's
# startup gate fails because PostgreSQL is unreachable.
#
# Persistence (named volumes):
# - kabuki-data: SQLite database, generated runtime secrets, storage origin ledger;
# - kabuki-uploads: local media;
# - kabuki-secrets: generated scale secrets;
# - kabuki-postgres, kabuki-redis, kabuki-minio.
# Switching profiles never moves data between drivers.
#
# Secrets:
# - Default profile: the API generates its JWT secrets once into kabuki-data (0600).
# - Scale profile: `secrets-init` generates random credentials once into kabuki-secrets, each
#   file 0400 and owned by the one service user that reads it. The credentials are the database
#   password and URL, the MinIO root credentials (used as the S3 keys) and the JWT pair shared by
#   every API node.
# - No secret is in this file, in an image or in `.env.example`, and nothing uses "minioadmin".
#
# Ports bind to KN_BIND_ADDRESS (default 127.0.0.1) for a TLS reverse proxy in front. Browser
# URLs (KN_PUBLIC_URL, KN_API_PUBLIC_URL, KN_MEDIA_PUBLIC_URL) must resolve from the user's
# browser, never to Compose service names.

name: kabuki-neko

x-api-environment: &api-environment
  NODE_ENV: production
  DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-default}
  DEPLOYMENT_TOPOLOGY: single
  NEXT_PUBLIC_APP_URL: ${KN_PUBLIC_URL:-http://localhost:3000}
  APP_URL: ${KN_PUBLIC_URL:-http://localhost:3000}
  CORS_ORIGIN: ${KN_PUBLIC_URL:-http://localhost:3000}
  NEXT_PUBLIC_API_URL: ${KN_API_PUBLIC_URL:-http://localhost:3001}
  NEXT_PUBLIC_WS_URL: ${KN_API_PUBLIC_URL:-http://localhost:3001}
  API_INTERNAL_URL: http://api:3001
  TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-[]}
  # Plain HTTP between the browser and local services is refused in production unless this is
  # set explicitly (local evaluation only; use TLS for real deployments).
  ALLOW_INSECURE_LOCAL_HTTP: ${ALLOW_INSECURE_LOCAL_HTTP:-false}
  # Scale profile secrets (files written by secrets-init; empty volume in the default profile).
  KN_SECRETS_DIR: /run/kabuki-secrets
  # Scale profile service addresses (ignored by the default drivers).
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_REGION: us-east-1
  S3_BUCKET: kabuki-neko-media
  S3_FORCE_PATH_STYLE: "true"
  S3_PUBLIC_URL: ${KN_MEDIA_PUBLIC_URL:-http://localhost:9000/kabuki-neko-media}

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: kabuki-neko-api:${KN_IMAGE_TAG:-local}
    restart: unless-stopped
    environment: *api-environment
    volumes:
      - kabuki-data:/app/data
      - kabuki-uploads:/app/uploads
      - kabuki-secrets:/run/kabuki-secrets:ro
    ports:
      - "${KN_BIND_ADDRESS:-127.0.0.1}:${KN_API_PORT:-3001}:3001"
    depends_on:
      secrets-init:
        condition: service_completed_successfully
        required: false
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    stop_grace_period: 30s

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: ${KN_PUBLIC_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${KN_API_PUBLIC_URL:-http://localhost:3001}
        NEXT_PUBLIC_WS_URL: ${KN_API_PUBLIC_URL:-http://localhost:3001}
        # Scale profile media (S3_PUBLIC_URL); harmless for the default profile.
        NEXT_PUBLIC_MEDIA_ORIGINS: ${KN_MEDIA_PUBLIC_URL:-http://localhost:9000/kabuki-neko-media}
    image: kabuki-neko-web:${KN_IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3001
    ports:
      - "${KN_BIND_ADDRESS:-127.0.0.1}:${KN_WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    stop_grace_period: 15s

  # Scale profile: generates the credentials once (existing files are kept) with per-service
  # ownership: API files for uid 10001, MinIO files for uid 65532, the PostgreSQL password for
  # root (its entrypoint reads it before dropping privileges).
  # KN_ROTATE_JWT_SECRETS=true replaces the JWT pair through an atomic rename, e.g. when a backup
  # or its secrets may have leaked (code review MJ-19; docs/operations.md). Everyone signs in again.
  secrets-init:
    profiles: ["scale"]
    image: kabuki-neko-api:${KN_IMAGE_TAG:-local}
    user: "0:0"
    environment:
      KN_ROTATE_JWT_SECRETS: ${KN_ROTATE_JWT_SECRETS:-false}
    entrypoint: ["node", "-e"]
    command:
      - |
        const { randomBytes } = require("node:crypto");
        const fs = require("node:fs");
        const dir = "/run/kabuki-secrets";
        const random = (bytes) => randomBytes(bytes).toString("hex");
        const rotate = process.env.KN_ROTATE_JWT_SECRETS === "true";
        const write = (name, value, uid, replace = false) => {
          const file = `$${dir}/$${name}`;
          if (fs.existsSync(file) && !replace) return fs.readFileSync(file, "utf8");
          const staged = `$${file}.new`;
          fs.writeFileSync(staged, value, { mode: 0o400 });
          fs.chownSync(staged, uid, uid);
          fs.renameSync(staged, file);
          return value;
        };
        const password = write("postgres_password", random(24), 0);
        write("database_url", `postgresql://kabuki:$${password}@postgres:5432/kabuki`, 10001);
        const access = write("s3_access_key", `kn$${random(10)}`, 10001);
        const secret = write("s3_secret_key", random(32), 10001);
        write("minio_root_user", access, 65532);
        write("minio_root_password", secret, 65532);
        write("jwt_access_secret", random(64), 10001, rotate);
        write("jwt_refresh_secret", random(64), 10001, rotate);
        process.stdout.write(rotate ? "secrets ready (JWT pair rotated)\n" : "secrets ready\n");
    volumes:
      - kabuki-secrets:/run/kabuki-secrets

  postgres:
    profiles: ["scale"]
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    restart: unless-stopped
    environment:
      POSTGRES_USER: kabuki
      POSTGRES_DB: kabuki
      POSTGRES_PASSWORD_FILE: /run/kabuki-secrets/postgres_password
    volumes:
      - kabuki-postgres:/var/lib/postgresql/data
      - kabuki-secrets:/run/kabuki-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kabuki -d kabuki"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    profiles: ["scale"]
    image: redis:7-alpine@sha256:7b1753b4c5ad8458906c272a8132b8c15f5557b000379eb115fb239706a384b7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - kabuki-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # MinIO from pinned upstream source (official images were withdrawn), as in the test fixtures.
  minio:
    profiles: ["scale"]
    build:
      context: .
      dockerfile_inline: |
        FROM golang:1.27.3-bookworm AS build
        ENV CGO_ENABLED=0 GOTOOLCHAIN=local
        WORKDIR /src
        RUN git init . && git remote add origin https://github.com/minio/minio.git && git fetch --depth=1 origin 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a && git checkout --detach FETCH_HEAD
        RUN go build -trimpath -o /out/minio . && mkdir -p /out/data
        FROM scratch
        COPY --from=build /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt
        COPY --from=build /out/minio /usr/bin/minio
        COPY --from=build /src/LICENSE /LICENSE
        COPY --from=build --chown=65532:65532 /out/data /data
        USER 65532:65532
        WORKDIR /data
        EXPOSE 9000
        ENTRYPOINT ["/usr/bin/minio"]
    image: ${KN_MINIO_IMAGE:-kabuki-neko/minio:9e49d5e7a648}
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER_FILE: /run/kabuki-secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/kabuki-secrets/minio_root_password
    volumes:
      - kabuki-minio:/data
      - kabuki-secrets:/run/kabuki-secrets:ro
    ports:
      # Browser-reachable public media (S3_PUBLIC_URL); put TLS in front for real deployments.
      - "${KN_BIND_ADDRESS:-127.0.0.1}:${KN_MEDIA_PORT:-9000}:9000"
    depends_on:
      secrets-init:
        condition: service_completed_successfully

  # Creates the media bucket and allows anonymous GetObject only: no listing, no writes.
  minio-init:
    profiles: ["scale"]
    image: kabuki-neko-api:${KN_IMAGE_TAG:-local}
    entrypoint: ["node", "-e"]
    working_dir: /app
    command:
      - |
        const fs = require("node:fs");
        const { S3Client, CreateBucketCommand, HeadBucketCommand, PutBucketPolicyCommand } = require("@aws-sdk/client-s3");
        const read = (name) => fs.readFileSync(`/run/kabuki-secrets/$${name}`, "utf8");
        const bucket = "kabuki-neko-media";
        const client = new S3Client({
          endpoint: "http://minio:9000",
          region: "us-east-1",
          forcePathStyle: true,
          credentials: { accessKeyId: read("s3_access_key"), secretAccessKey: read("s3_secret_key") },
        });
        const policy = {
          Version: "2012-10-17",
          Statement: [{ Effect: "Allow", Principal: { AWS: ["*"] }, Action: ["s3:GetObject"], Resource: [`arn:aws:s3:::$${bucket}/*`] }],
        };
        (async () => {
          for (let attempt = 0; ; attempt++) {
            try { await client.send(new HeadBucketCommand({ Bucket: bucket })); break; }
            catch (error) {
              if (error?.$$metadata?.httpStatusCode === 404) { await client.send(new CreateBucketCommand({ Bucket: bucket })); break; }
              if (attempt > 60) throw error;
              await new Promise((resolve) => setTimeout(resolve, 1000));
            }
          }
          await client.send(new PutBucketPolicyCommand({ Bucket: bucket, Policy: JSON.stringify(policy) }));
          process.stdout.write("bucket ready: public read, no listing, no anonymous writes\n");
        })().catch((error) => { process.stderr.write(`minio-init failed: $${error.name}\n`); process.exit(1); });
    volumes:
      - kabuki-secrets:/run/kabuki-secrets:ro
    depends_on:
      minio:
        condition: service_started

volumes:
  kabuki-data:
  kabuki-uploads:
  kabuki-secrets:
  kabuki-postgres:
  kabuki-redis:
  kabuki-minio:

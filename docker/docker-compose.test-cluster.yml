      - --cluster-announce-ip
      - 127.0.0.1
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${KN_CLUSTER_PORT_5:-17005}", "ping"]
      interval: 1s
      timeout: 2s
      retries: 30
  init:
    image: redis:7-alpine
    network_mode: host
    restart: "no"
    labels:
      com.kabuki-neko.purpose: test-cluster
    depends_on:
      node-0:
        condition: service_healthy
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
      node-3:
        condition: service_healthy
      node-4:
        condition: service_healthy
      node-5:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - >-
        redis-cli --cluster create 127.0.0.1:${KN_CLUSTER_PORT_0:-17000} 127.0.0.1:${KN_CLUSTER_PORT_1:-17001} 127.0.0.1:${KN_CLUSTER_PORT_2:-17002} 127.0.0.1:${KN_CLUSTER_PORT_3:-17003} 127.0.0.1:${KN_CLUSTER_PORT_4:-17004} 127.0.0.1:${KN_CLUSTER_PORT_5:-17005}
        --cluster-replicas 1 --cluster-yes

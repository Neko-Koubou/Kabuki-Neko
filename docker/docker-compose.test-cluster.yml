    command:
      - redis-server
      - --port
      - "${KN_CLUSTER_PORT_2:-17002}"
      - --bind
      - 127.0.0.1
      - --protected-mode
      - "no"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes-2.conf
      - --cluster-node-timeout
      - "2000"
      - --cluster-announce-ip
      - 127.0.0.1
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${KN_CLUSTER_PORT_2:-17002}", "ping"]

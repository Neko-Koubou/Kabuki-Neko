      interval: 1s
      timeout: 2s
      retries: 30
  node-4:
    <<: *node
    command:
      - redis-server
      - --port
      - "${KN_CLUSTER_PORT_4:-17004}"
      - --bind
      - 127.0.0.1
      - --protected-mode
      - "no"
      - --cluster-enabled

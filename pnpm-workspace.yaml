packages:
  - "apps/*"
  - "packages/*"

engineStrict: true
strictPeerDependencies: true
saveExact: true

onlyBuiltDependencies:
  - better-sqlite3
  - esbuild

# Nest CLI pins webpack below the schema-utils peer requirement.
overrides:
  "@nestjs/cli@11.0.24>webpack": "5.112.2"
  "@nestjs/platform-express@11.2.8>multer": "2.5.0"
